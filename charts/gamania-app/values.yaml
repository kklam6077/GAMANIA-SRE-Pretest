image:
  repository: 694322569347.dkr.ecr.ap-southeast-1.amazonaws.com/gamania-nginx 
  tag: latest
  pullPolicy: Always

replicaCount: 2 

service:
  type: LoadBalancer 
  port: 80           
  targetPort: 8080

resources: 
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
